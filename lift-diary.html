<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift diary</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f8f9;--ink:#14181c;--mute:#7a828a;--line:#e3e7eb;--acc:#2446c4;--accbg:#e9edfb;--warn:#b3392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101214;--ink:#eceff2;--mute:#8b939b;--line:#252a2f;--acc:#7b94f2;--accbg:#1b2236;--warn:#e5806f}}
:root[data-theme="dark"]{--bg:#101214;--ink:#eceff2;--mute:#8b939b;--line:#252a2f;--acc:#7b94f2;--accbg:#1b2236;--warn:#e5806f}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 "Instrument Sans",system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:20px 20px 110px}
h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:8px 0 2px}
h2{font-size:15px;font-weight:600;margin:28px 0 4px}
.sub,.hint{color:var(--mute);font-size:14px}
.sub{margin:0 0 20px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ex{border-top:1px solid var(--line);padding:16px 0}
.ex b{font-weight:600;font-size:18px}
.x{color:var(--mute);padding:6px 8px;margin:-6px -8px;font-size:15px}
.set{display:flex;gap:14px;align-items:baseline;padding:6px 0}
.set i{font-style:normal;color:var(--mute);width:18px;font-size:14px}
.set span{font-size:22px;font-weight:500;flex:1}
.set small{font-size:14px;color:var(--mute);font-weight:400}
.add{display:flex;gap:8px;align-items:center;margin-top:10px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.add input{width:80px;text-align:center;font-size:18px}
.add span{color:var(--mute)}
.pri{background:var(--acc);color:#fff;border-radius:8px;padding:11px 16px;font-weight:500;margin-left:auto}
.full{width:100%;border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--acc);font-weight:500;margin-top:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;padding:16px 0;color:var(--mute);font-weight:500}
.tabs button.on{color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
.sheet{border:1px solid var(--line);border-radius:12px;padding:6px 16px 12px;margin-top:12px}
.sheet h2{margin:14px 0 2px}
.pick{display:block;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.hrow{display:block;width:100%;text-align:left;border-top:1px solid var(--line);padding:14px 0}
.hrow .t{font-weight:600}
.det{padding:0 0 14px;color:var(--mute);font-size:15px}
.det p{margin:6px 0}
.det b{color:var(--ink);font-weight:600}
.link{color:var(--warn);font-size:14px;margin-top:6px}
.er{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.er div{flex:1}
.form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.form input{flex:1;min-width:120px}
.form button{border:1px solid var(--acc);color:var(--acc);border-radius:8px;padding:10px 14px;font-weight:500}
textarea{width:100%;height:90px;font:13px/1.3 ui-monospace,monospace;margin-top:10px}
.empty{color:var(--mute);padding:24px 0}
</style>
</head>
<body>
<main id="m"></main>
<nav class="tabs">
<button data-a="tab" data-id="log">Log</button>
<button data-a="tab" data-id="hist">History</button>
<button data-a="tab" data-id="ex">Exercises</button>
</nav>
<script>
const K='liftdiary.v1',$=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=d=>new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});
function seed(){
  const cats=['Push','Pull','Legs','Core'].map(n=>({id:uid(),name:n}));
  const c=n=>cats.find(x=>x.name==n).id;
  const ex=[['Bench press','Push'],['Overhead press','Push'],['Pull-up','Pull'],['Barbell row','Pull'],['Squat','Legs'],['Deadlift','Legs']].map(([n,k])=>({id:uid(),name:n,cat:c(k)}));
  return{cats,ex,sessions:[]};
}
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.cats&&s.ex&&s.sessions)return s}catch(e){}return seed()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
let S=load(),tab='log',picking=false,openId=null,note='';
const exOf=id=>S.ex.find(x=>x.id==id)||{name:'Deleted exercise',cat:''};
function sess(create){
  let s=S.sessions.find(x=>x.date==today());
  if(!s&&create){s={id:uid(),date:today(),entries:[]};S.sessions.push(s)}
  return s;
}
function hist(id){
  return S.sessions.filter(s=>s.entries.some(e=>e.exId==id&&e.sets.length))
    .sort((a,b)=>a.date<b.date?-1:1)
    .map(s=>({d:s.date,sets:s.entries.find(e=>e.exId==id).sets}));
}
const lastFor=id=>hist(id).filter(h=>h.d!==today()).pop();
const setTxt=t=>t.w+'×'+t.r;
function best(id){
  let b=null;
  hist(id).forEach(h=>h.sets.forEach(t=>{if(!b||t.w>b.w||(t.w==b.w&&t.r>b.r))b=t}));
  return b;
}
function spark(id){
  const v=hist(id).map(h=>Math.max(...h.sets.map(t=>t.w)));
  if(v.length<2)return'';
  const lo=Math.min(...v),hi=Math.max(...v),r=hi-lo||1;
  const p=v.map((y,i)=>(i/(v.length-1)*64+2).toFixed(1)+','+(20-(y-lo)/r*16).toFixed(1)).join(' ');
  return`<svg width="68" height="24" viewBox="0 0 68 24" aria-hidden="true"><polyline points="${p}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function viewLog(){
  const s=sess();
  let h=`<h1>Today</h1><p class="sub">${fmt(today())}</p>`;
  if(s)for(const e of s.entries){
    const prev=lastFor(e.exId),l=e.sets[e.sets.length-1]||(prev&&prev.sets[prev.sets.length-1])||{w:'',r:''};
    h+=`<div class="ex"><div class="row"><b>${esc(exOf(e.exId).name)}</b><button class="x" data-a="rmEntry" data-id="${e.exId}" aria-label="Remove exercise">Remove</button></div>`;
    if(prev)h+=`<div class="hint">Last time: ${prev.sets.map(setTxt).join(', ')}</div>`;
    e.sets.forEach((t,i)=>{h+=`<div class="set"><i>${i+1}</i><span>${t.w} <small>kg</small> × ${t.r}</span><button class="x" data-a="rmSet" data-id="${e.exId}" data-i="${i}" aria-label="Remove set">✕</button></div>`});
    h+=`<div class="add"><input id="w${e.exId}" type="number" inputmode="decimal" step="any" placeholder="kg" value="${l.w}" aria-label="Weight in kg"><span>×</span><input id="r${e.exId}" type="number" inputmode="numeric" placeholder="reps" value="${l.r}" aria-label="Reps"><button class="pri" data-a="addSet" data-id="${e.exId}">Add set</button></div></div>`;
  }
  if(!s||!s.entries.length)h+=`<div class="empty">Nothing logged yet today. Add your first exercise.</div>`;
  h+=`<button class="full" data-a="pick">${picking?'Close':'Add exercise'}</button>`;
  if(picking){
    const used=new Set(s?s.entries.map(e=>e.exId):[]);let any=false;h+=`<div class="sheet">`;
    S.cats.forEach(c=>{
      const xs=S.ex.filter(x=>x.cat==c.id&&!used.has(x.id));
      if(xs.length){any=true;h+=`<h2>${esc(c.name)}</h2>`+xs.map(x=>`<button class="pick" data-a="add" data-id="${x.id}">${esc(x.name)}</button>`).join('')}
    });
    if(!any)h+=`<p class="hint">No exercises left to add. Create new ones in the Exercises tab.</p>`;
    h+=`</div>`;
  }
  return h;
}
function viewHist(){
  const ss=[...S.sessions].sort((a,b)=>a.date<b.date?1:-1);
  let h=`<h1>History</h1><p class="sub">${ss.length} ${ss.length==1?'session':'sessions'} logged</p>`;
  if(!ss.length)return h+`<div class="empty">Your finished sessions will show up here.</div>`;
  for(const s of ss){
    const vol=s.entries.reduce((a,e)=>a+e.sets.reduce((b,t)=>b+t.w*t.r,0),0);
    h+=`<button class="hrow" data-a="open" data-id="${s.id}"><div class="row"><span class="t">${fmt(s.date)}</span><span class="hint">${Math.round(vol).toLocaleString()} kg total</span></div><div class="hint">${s.entries.map(e=>esc(exOf(e.exId).name)).join(', ')}</div></button>`;
    if(openId==s.id){
      h+=`<div class="det">`+s.entries.map(e=>`<p><b>${esc(exOf(e.exId).name)}</b><br>${e.sets.map(setTxt).join(' · ')}</p>`).join('')+`<button class="link" data-a="rmSess" data-id="${s.id}">Delete session</button></div>`;
    }
  }
  return h;
}
function viewEx(){
  let h=`<h1>Exercises</h1><p class="sub">Build your own list and categories.</p>`;
  S.cats.forEach(c=>{
    const xs=S.ex.filter(x=>x.cat==c.id);
    h+=`<div class="row"><h2>${esc(c.name)}</h2>${xs.length?'':`<button class="x" data-a="rmCat" data-id="${c.id}">Remove category</button>`}</div>`;
    if(!xs.length)h+=`<div class="hint" style="padding:8px 0">No exercises yet.</div>`;
    xs.forEach(x=>{
      const b=best(x.id);
      h+=`<div class="er"><div>${esc(x.name)}<div class="hint">${b?'Best '+setTxt(b)+' kg':'Not logged yet'}</div></div>${spark(x.id)}<button class="x" data-a="rmEx" data-id="${x.id}" aria-label="Delete exercise">✕</button></div>`;
    });
  });
  h+=`<h2>New exercise</h2><div class="form"><input id="nx" placeholder="Name" aria-label="Exercise name"><select id="nc" aria-label="Category">${S.cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button data-a="addEx">Add exercise</button></div>`;
  h+=`<h2>New category</h2><div class="form"><input id="ncat" placeholder="Name" aria-label="Category name"><button data-a="addCat">Add category</button></div>`;
  h+=`<h2>Backup</h2><p class="hint" style="margin:0">Your data lives only in this browser. Copy the backup text and keep it somewhere safe.</p><div class="form"><button data-a="bk">Show backup</button><button data-a="restore">Restore from text</button></div><textarea id="bkt" placeholder="Backup text appears here. Paste a backup here to restore." aria-label="Backup text"></textarea>`;
  if(note)h+=`<p class="hint">${esc(note)}</p>`;
  return h;
}
function render(){
  $('m').innerHTML=tab=='log'?viewLog():tab=='hist'?viewHist():viewEx();
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.id==tab));
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id;note='';
  if(a=='tab'){tab=id;picking=false;scrollTo(0,0)}
  else if(a=='pick')picking=!picking;
  else if(a=='add'){const s=sess(true);if(!s.entries.some(e=>e.exId==id))s.entries.push({exId:id,sets:[]});picking=false}
  else if(a=='addSet'){
    const w=parseFloat($('w'+id).value),r=parseInt($('r'+id).value,10);
    if(isNaN(w)||!(r>0))return;
    sess().entries.find(e=>e.exId==id).sets.push({w,r});
  }
  else if(a=='rmSet')sess().entries.find(e=>e.exId==id).sets.splice(+b.dataset.i,1);
  else if(a=='rmEntry'){const s=sess();s.entries=s.entries.filter(e=>e.exId!=id);if(!s.entries.length)S.sessions=S.sessions.filter(x=>x!==s)}
  else if(a=='open')openId=openId==id?null:id;
  else if(a=='rmSess'){S.sessions=S.sessions.filter(x=>x.id!=id);openId=null}
  else if(a=='addEx'){const n=$('nx').value.trim();if(!n||!S.cats.length)return;S.ex.push({id:uid(),name:n,cat:$('nc').value})}
  else if(a=='rmEx')S.ex=S.ex.filter(x=>x.id!=id);
  else if(a=='addCat'){const n=$('ncat').value.trim();if(!n)return;S.cats.push({id:uid(),name:n})}
  else if(a=='rmCat')S.cats=S.cats.filter(c=>c.id!=id);
  else if(a=='bk'){note='Backup ready. Copy the text above.';render();const t=$('bkt');t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value).catch(()=>{})}catch(e){}return}
  else if(a=='restore'){
    try{const d=JSON.parse($('bkt').value);if(!(d.cats&&d.ex&&d.sessions))throw 0;S=d;note='Backup restored.'}
    catch(e){note='That text is not a valid backup.'}
  }
  save();render();
});
render();
</script>
</body>
</html>
